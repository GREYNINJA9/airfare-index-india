name: airfare-index-india

services:
  postgres:
    image: postgres:16-alpine
    container_name: airfare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airfare_index}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airfare_index}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airfare-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AUTO_SEED=${AUTO_SEED:-false}
      - USE_MOCK_DATA=false
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-airfare_index}}
      - MOSPI_CPI_API_URL=${MOSPI_CPI_API_URL:-https://api.mospi.gov.in/api/cpi/getCPIData?base_year=2024&year=2026&group_code=24&class_code=58&item_code=07.3.3&limit=100}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airfare-scheduler
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - SAVE_RAW=${SAVE_RAW:-false}
      - SCHEDULER_INTERVAL_SECONDS=${SCHEDULER_INTERVAL_SECONDS:-3600}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-airfare_index}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "scheduler.runner"]

volumes:
  pgdata:
