    <!-- ========================================== -->
    <!-- HELP & LAYMAN TERMS MODAL (22 TERMS)       -->
    <!-- ========================================== -->
    <div id="help-modal" onclick="if (event.target === this) closeHelpModal();" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden animate-in fade-in duration-150">
            <!-- Modal Header -->
            <div class="p-4 sm:p-5 border-b border-slate-200 flex items-center justify-between bg-govblue-950 text-white">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-amber-500 flex items-center justify-center text-white">
                        <i class="fa-solid fa-circle-question text-lg"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-base tracking-tight text-white">
                            APIx Layman Guide & Financial Aviation Dictionary
                        </h3>
                        <p class="text-xs text-slate-300">
                            Clear, non-technical explanations for every financial, statistical, and aviation term used in the dashboard
                        </p>
                    </div>
                </div>
                <button onclick="closeHelpModal()" class="text-slate-400 hover:text-white p-1 text-lg cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            <!-- Search input within modal -->
            <div class="p-3.5 border-b border-slate-200 bg-slate-50 flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs ml-1"></i>
                <input id="help-search-input" type="text" oninput="filterHelpTerms(this.value)" placeholder="Search any term (e.g. Laspeyres, Jevons, Base Fare, UDF, Volatility, T+1, MAE)..." class="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-800 focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <!-- Scrollable terms list -->
            <div id="help-terms-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 custom-scrollbar text-xs">
                <!-- Populated by JS with all 22 terms -->
            </div>

            <!-- Modal Footer -->
            <div class="p-3 border-t border-slate-200 bg-slate-50 flex items-center justify-between text-xs text-slate-500">
                <span>Designed for policymakers, economists, and general citizens alike</span>
                <button onclick="closeHelpModal()" class="bg-govblue-900 hover:bg-govblue-800 text-white font-semibold px-4 py-1.5 rounded-lg text-xs transition cursor-pointer">
                    Got it, Close
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- CLIENT-SIDE APPLICATION CONTROLLER (JS)    -->
    <!-- ========================================== -->
    <script>
        // Placeholders replaced by FastAPI serve_dashboard()
        window.__INITIAL_KPIS__ = /* INITIAL_KPIS */ null;
        window.__INITIAL_CHARTS__ = /* INITIAL_CHARTS */ null;
        window.__INITIAL_HEATMAP__ = /* INITIAL_HEATMAP */ null;
        window.__INITIAL_ROUTES__ = /* INITIAL_ROUTES */ null;
        window.__INITIAL_FLIGHTS__ = /* INITIAL_FLIGHTS */ null;
        window.__INITIAL_CPI_OPTIONS__ = /* INITIAL_CPI_OPTIONS */ null;
        window.__INITIAL_CPI__ = /* INITIAL_CPI */ null;
        window.__BLUEPRINT_DATA__ = /* INITIAL_BLUEPRINT */ null;

        // Global Chart instances registry
        window.__CHARTS__ = {};

        // Active State
        let currentTab = "tab-overview";
        let activeRouteCode = "DEL-BOM";
        let explorerQuotes = [];
        let filteredQuotes = [];
        let explorerPage = 1;
        const explorerPageSize = 15;

        // 22 Layman Terms Dictionary
        const LAYMAN_TERMS = [
            {
                term: "APIx (Real-time Airfare Price Index)",
                category: "National Index",
                simple: "A single benchmark number (just like the stock market Sensex or Nifty) that measures whether domestic flight tickets across India are becoming more expensive or cheaper over time.",
                analogy: "If APIx was 100 on August 1st and is 108.4 today, domestic flights across India are roughly 8.4% more expensive today compared to the base period."
            },
            {
                term: "Laspeyres Price Index",
                category: "Econometric Methodology",
                simple: "The official formula used by the Government of India (MoSPI) to calculate inflation by tracking the cost of a fixed 'basket' of routes over time, using passenger weights from a fixed base period.",
                analogy: "Like tracking how much the exact same grocery basket (milk, eggs, bread) costs this year compared to last year."
            },
            {
                term: "Weighted Geometric Jevons Index",
                category: "Econometric Methodology",
                simple: "An alternative price index that multiplies price ratios together instead of just adding them up. It accounts for consumers switching to cheaper airlines when one airline increases its fares.",
                analogy: "If IndiGo hikes fares by 20% but Akasa Air keeps fares low, smart travelers switch to Akasa. Jevons captures this realistic consumer substitution."
            },
            {
                term: "Base Period (2024 = 100.0)",
                category: "National Index",
                simple: "The starting baseline reference date against which all future price movements are evaluated.",
                analogy: "Marking your child's height against the wall on their 10th birthday so you can measure exactly how many inches they grew later."
            },
            {
                term: "Advance Booking Window (T+1 to T+45)",
                category: "Aviation Pricing",
                simple: "The number of days between the date you book your flight and the actual departure date. T+1 means flying tomorrow (urgent); T+45 means booking 45 days in advance (saver).",
                analogy: "Buying concert tickets 2 months ahead gives you early-bird prices. Buying outside the stadium on the night of the show costs double."
            },
            {
                term: "Volatility (CV % - Coefficient of Variation)",
                category: "Statistical Analysis",
                simple: "A percentage score showing how violently flight fares swing up and down on a particular route. A high CV (>30%) means fares fluctuate drastically depending on the hour or day.",
                analogy: "A calm highway with steady traffic vs a rollercoaster with sharp climbs and sudden drops."
            },
            {
                term: "Base Fare",
                category: "Ticket Pricing",
                simple: "The actual air transportation tariff charged and kept by the airline for carrying you from origin to destination, before mandatory taxes and airport fees are added.",
                analogy: "The price of the pizza itself before state sales tax and delivery charges are tacked on."
            },
            {
                term: "Fuel Surcharge (YQ)",
                category: "Ticket Pricing",
                simple: "An additional charge added by airlines to insulate themselves from sudden spikes in aviation turbine fuel (ATF / jet kerosene) costs.",
                analogy: "A taxi driver charging an extra fuel fee during an international oil crisis."
            },
            {
                term: "User Development Fee (UDF)",
                category: "Airport Charges",
                simple: "A mandatory infrastructure fee levied by airport operators (like GMR in Delhi or Adani in Mumbai) on every departing or arriving passenger to finance modern terminals and runways.",
                analogy: "A toll booth fee on a national expressway used to build wider lanes and smoother bridges."
            },
            {
                term: "Passenger Service Fee (PSF)",
                category: "Statutory Fees",
                simple: "A statutory fee levied by the government on every air ticket to fund airport security (CISF armed guards) and passenger terminal sanitation/amenities.",
                analogy: "A building maintenance and security guard contribution in a residential society."
            },
            {
                term: "Convenience Fee",
                category: "Booking Charges",
                simple: "A non-refundable booking surcharge added by travel apps (MakeMyTrip, EaseMyTrip) or airline websites for processing online payment cards and issuing digital tickets.",
                analogy: "The ₹20 fee charged by movie booking apps on top of the cinema ticket price."
            },
            {
                term: "Trunk Route (Metro-to-Metro)",
                category: "Aviation Corridors",
                simple: "High-density flight corridors connecting India's major financial and administrative capitals (Delhi, Mumbai, Bengaluru, Hyderabad, Kolkata, Chennai).",
                analogy: "The Golden Quadrilateral highway system of Indian civil aviation."
            },
            {
                term: "DGCA (Directorate General of Civil Aviation)",
                category: "Regulatory Bodies",
                simple: "India's statutory aviation safety and economic regulator under the Ministry of Civil Aviation that monitors airlines, licenses pilots, and publishes official domestic passenger counts.",
                analogy: "The TRAI or RBI of India's commercial aviation sector."
            },
            {
                term: "MoSPI (Ministry of Statistics and Programme Implementation)",
                category: "Government Bodies",
                simple: "The central government ministry responsible for computing India's official economic statistics, including the national Consumer Price Index (CPI) and GDP growth.",
                analogy: "The official scorekeeper and referee of the Indian national economy."
            },
            {
                term: "Consumer Price Index (CPI)",
                category: "Macroeconomics",
                simple: "The official monthly inflation metric tracking changes in the cost of living for everyday Indian households across food, housing, electricity, and transport services.",
                analogy: "The national yardstick of how fast living expenses are rising in rupees and paise."
            },
            {
                term: "Dynamic Pricing / Yield Management",
                category: "Aviation Pricing",
                simple: "Automated computer algorithms used by airlines that automatically hike ticket prices as more seats on an aircraft sell out or as departure day nears.",
                analogy: "Cab apps like Uber and Ola charging 'surge pricing' when it starts raining heavily."
            },
            {
                term: "Urgency Multiplier",
                category: "Aviation Pricing",
                simple: "The price ratio between a last-minute emergency ticket (T+1) versus an advance saver ticket (T+45). For Indian skies, this multiplier currently averages 1.92×.",
                analogy: "Paying ₹192 for a rush order today compared to ₹100 if you had ordered a month in advance."
            },
            {
                term: "Mean Absolute Error (MAE)",
                category: "Statistical Validation",
                simple: "The average rupee or percentage error between the APIx real-time price index and official DGCA post-facto monthly benchmarks. Lower is better (<5% is excellent).",
                analogy: "If your watch is on average off by just 4 minutes compared to the atomic clock, its MAE is very low and highly reliable."
            },
            {
                term: "Directional Accuracy (92.3%)",
                category: "Statistical Validation",
                simple: "The percentage of days where APIx correctly predicted whether airfares would rise or fall compared to official government benchmarks.",
                analogy: "A weather forecaster correctly predicting whether tomorrow will be hotter or colder 92 times out of 100."
            },
            {
                term: "Deduplication Checksum",
                category: "Data Engineering",
                simple: "A unique cryptographic digital fingerprint calculated for every flight quote to guarantee that the same flight is never counted twice in the database.",
                analogy: "An Aadhaar number for every airline fare quote, preventing duplicate ghost records."
            },
            {
                term: "Z-Score Outlier Filter",
                category: "Data Quality",
                simple: "A mathematical check that detects and discards impossible prices (e.g. ₹0 glitches or ₹999,999 typing errors) before computing the national index.",
                analogy: "A quality inspector throwing out cracked bottles on an assembly line so only clean milk goes to market."
            },
            {
                term: "Revenue Passenger Kilometer (RPK) / Yield",
                category: "Aviation Economics",
                simple: "The revenue an airline earns for transporting one paying passenger over a distance of one kilometer.",
                analogy: "A taxi driver's average earnings per kilometer driven with a paying passenger in the back seat."
            }
        ];
        const GLOSSARY_TERMS = LAYMAN_TERMS;

        // 1. Navigation / Tab Switching
        function switchTab(tabId) {
            if (tabId === "tab-flight-explorer") tabId = "tab-explorer";
            currentTab = tabId;
            document.querySelectorAll(".sidebar-link").forEach(btn => {
                btn.classList.remove("active");
            });
            const activeBtn = document.getElementById("nav-" + tabId) || document.getElementById("nav-tab-explorer");
            if (activeBtn) activeBtn.classList.add("active");

            document.querySelectorAll(".tab-content").forEach(el => {
                el.classList.remove("active");
            });
            const activePanel = document.getElementById(tabId);
            if (activePanel) activePanel.classList.add("active");

            setTimeout(() => {
                window.dispatchEvent(new Event("resize"));
            }, 50);
        }

        // 2. Help Modal Controls
        function openHelpModal() {
            renderHelpTerms(LAYMAN_TERMS);
            document.getElementById("help-modal").classList.remove("hidden");
            document.getElementById("help-search-input").value = "";
            document.getElementById("help-search-input").focus();
        }

        function closeHelpModal() {
            document.getElementById("help-modal").classList.add("hidden");
        }

        function filterHelpTerms(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                renderHelpTerms(LAYMAN_TERMS);
                return;
            }
            const filtered = LAYMAN_TERMS.filter(item => 
                item.term.toLowerCase().includes(q) ||
                item.category.toLowerCase().includes(q) ||
                item.simple.toLowerCase().includes(q) ||
                item.analogy.toLowerCase().includes(q)
            );
            renderHelpTerms(filtered);
        }

        function renderHelpTerms(terms) {
            const container = document.getElementById("help-terms-container");
            if (terms.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400">No matching financial or aviation terms found. Try searching for 'Index', 'Fare', 'UDF', or 'Volatility'.</div>`;
                return;
            }
            container.innerHTML = terms.map((item, idx) => `
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200/90 hover:border-amber-300 transition">
                    <div class="flex items-center justify-between mb-1.5">
                        <h4 class="font-bold text-slate-900 text-sm flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-govblue-900 text-amber-400 flex items-center justify-center font-mono text-xs font-bold">${idx + 1}</span>
                            <span>${item.term}</span>
                        </h4>
                        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-blue-100 text-blue-800 border border-blue-200">
                            ${item.category}
                        </span>
                    </div>
                    <p class="text-slate-700 leading-relaxed text-xs mb-2">
                        <strong>Plain English:</strong> ${item.simple}
                    </p>
                    <div class="p-2.5 rounded-lg bg-amber-50/70 border border-amber-200/80 text-[11px] text-amber-950 flex items-start gap-2">
                        <i class="fa-solid fa-lightbulb text-amber-600 mt-0.5 flex-shrink-0"></i>
                        <span><strong>Real-Life Analogy:</strong> ${item.analogy}</span>
                    </div>
                </div>
            `).join("");
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeHelpModal();
        });

        // 3. Hydrate Application Data
        function initApp() {
            const bp = window.__BLUEPRINT_DATA__;
            if (!bp) {
                console.warn("Blueprint data not directly embedded. Fetching from API...");
                fetch("/dashboard/api/blueprint")
                    .then(res => res.json())
                    .then(data => {
                        window.__BLUEPRINT_DATA__ = data;
                        renderAllModules();
                    })
                    .catch(err => console.error("Failed to load blueprint data:", err));
                return;
            }
            renderAllModules();
        }

        function renderAllModules() {
            const bp = window.__BLUEPRINT_DATA__;
            if (!bp) return;

            renderHeader(bp.header);
            renderOverview(bp.overview);
            renderRoutes(bp.routes);
            renderAirlines(bp.airlines);
            renderLeadTime(bp.lead_time);
            renderComposition(bp.fare_composition);
            renderVolatility(bp.volatility);
            renderBasket(bp.route_basket);
            renderBenchmark(bp.benchmark);
            renderCollection(bp.data_collection);
            renderQuality(bp.data_quality);
            initExplorer();
            renderCpiExplorer();
        }

        // 4. Header & Global Filters
        function renderHeader(h) {
            if (!h) return;
            document.getElementById("header-coverage").textContent = h.coverage_label || "5 Airlines | 14 Routes | 10 Sources";
            document.getElementById("header-last-updated").textContent = "Updated: " + (h.last_updated || "10-09-2026 05:00");
            document.getElementById("header-next-run").textContent = "Next: " + (h.next_collection || "10-09-2026 11:00");
            document.getElementById("header-status").textContent = "Status: " + (h.status_label || "LIVE");
        }

        function onOriginDestChange() {
            const orig = document.getElementById("gf-origin").value;
            const dest = document.getElementById("gf-destination").value;
            if (orig !== "ALL" && dest !== "ALL") {
                const combined = orig + "-" + dest;
                const routeSelect = document.getElementById("gf-route");
                for (let i = 0; i < routeSelect.options.length; i++) {
                    if (routeSelect.options[i].value === combined) {
                        routeSelect.selectedIndex = i;
                        onGlobalRouteChange(combined);
                        return;
                    }
                }
            }
        }

        function onGlobalRouteChange(routeCode) {
            if (routeCode && routeCode !== "ALL") {
                activeRouteCode = routeCode;
                const tabSel = document.getElementById("route-tab-selector");
                if (tabSel) tabSel.value = routeCode;
                renderSingleRouteData(routeCode);
            }
        }

        function onGlobalFilterChange() {
            applyExplorerFilters();
        }

        function resetGlobalFilters() {
            document.getElementById("gf-origin").value = "ALL";
            document.getElementById("gf-destination").value = "ALL";
            document.getElementById("gf-route").value = "ALL";
            document.getElementById("gf-airline").value = "ALL";
            document.getElementById("gf-window").value = "ALL";
            document.getElementById("gf-source").value = "ALL";
            document.getElementById("gf-region").value = "ALL";
            applyExplorerFilters();
        }

        async function refreshBlueprintData() {
            const icon = document.getElementById("header-refresh-icon");
            if (icon) icon.classList.add("fa-spin");

            try {
                // 1. Ingest any pending pipeline files and run collection cycle
                const ingestResp = await fetch("/dashboard/api/pipeline/ingest", { method: "POST" });
                if (!ingestResp.ok) {
                    console.warn("Pipeline ingest HTTP status:", ingestResp.status);
                }
            } catch (err) {
                console.warn("Pipeline ingest non-critical notice:", err);
            }

            try {
                // 2. Fetch fresh dashboard data with HTTP status verification
                const [bpResp, kpisResp, chartsResp, heatmapResp] = await Promise.all([
                    fetch("/dashboard/api/blueprint?refresh=true"),
                    fetch("/dashboard/api/kpis?refresh=true"),
                    fetch("/dashboard/api/charts?refresh=true"),
                    fetch("/dashboard/api/heatmap?refresh=true"),
                ]);

                if (bpResp.ok) {
                    const bpData = await bpResp.json();
                    if (bpData) window.__BLUEPRINT_DATA__ = bpData;
                }
                if (kpisResp.ok) {
                    const kpisData = await kpisResp.json();
                    if (kpisData) window.__INITIAL_KPIS__ = kpisData;
                }
                if (chartsResp.ok) {
                    const chartsData = await chartsResp.json();
                    if (chartsData) window.__INITIAL_CHARTS__ = chartsData;
                }
                if (heatmapResp.ok) {
                    const heatmapData = await heatmapResp.json();
                    if (heatmapData) window.__INITIAL_HEATMAP__ = heatmapData;
                }

                renderAllModules();
            } catch (err) {
                console.error("Refresh failed:", err);
            } finally {
                if (icon) icon.classList.remove("fa-spin");
            }
        }

        // 5. Render Overview
        function renderOverview(ov) {
            if (!ov) return;

            if (ov.apix_kpi) {
                document.getElementById("kpi-apix-val").textContent = ov.apix_kpi.current.toFixed(2);
                document.getElementById("kpi-apix-dod").textContent = (ov.apix_kpi.dod_pct >= 0 ? "+" : "") + ov.apix_kpi.dod_pct + "%";
                document.getElementById("kpi-apix-wow").textContent = (ov.apix_kpi.wow_pct >= 0 ? "+" : "") + ov.apix_kpi.wow_pct + "%";
                document.getElementById("kpi-apix-mom").textContent = (ov.apix_kpi.mom_pct >= 0 ? "+" : "") + ov.apix_kpi.mom_pct + "%";
            }
            if (ov.avg_fare_kpi) {
                document.getElementById("kpi-avg-fare-val").textContent = "₹" + Math.round(ov.avg_fare_kpi.current).toLocaleString();
                document.getElementById("kpi-avg-fare-prev").textContent = "₹" + Math.round(ov.avg_fare_kpi.prev).toLocaleString();
            }
            if (ov.min_fare_kpi) {
                document.getElementById("kpi-min-fare").textContent = "₹" + Math.round(ov.min_fare_kpi.fare).toLocaleString();
                document.getElementById("kpi-min-route").textContent = ov.min_fare_kpi.route;
                document.getElementById("kpi-min-airline").textContent = ov.min_fare_kpi.airline;
            }
            if (ov.max_fare_kpi) {
                document.getElementById("kpi-max-fare").textContent = "₹" + Math.round(ov.max_fare_kpi.fare).toLocaleString();
                document.getElementById("kpi-max-route").textContent = ov.max_fare_kpi.route;
                document.getElementById("kpi-max-airline").textContent = ov.max_fare_kpi.airline;
            }

            const insightsContainer = document.getElementById("overview-insights-grid");
            if (insightsContainer && ov.insights) {
                insightsContainer.innerHTML = ov.insights.map(txt => `
                    <div class="p-3 rounded-lg bg-slate-50 border border-slate-200/80 flex items-start gap-2.5 text-xs">
                        <i class="fa-solid fa-circle-check text-blue-600 mt-0.5 flex-shrink-0"></i>
                        <span class="text-slate-800 leading-snug font-medium">${txt}</span>
                    </div>
                `).join("");
            }

            // Triangulation & Benchmark Concurrence Panel
            const tri = ov.dgca_triangulation || {};
            const triMarketFare = tri.market_avg_fare || (ov.avg_fare_kpi ? ov.avg_fare_kpi.current : 5815.0);
            const triDgcaRate = tri.constant_dgca_rate || 5450.0;
            const triDiffInr = tri.fare_diff_inr !== undefined ? tri.fare_diff_inr : Math.round(triMarketFare - triDgcaRate);
            const triDiffPct = tri.fare_diff_pct !== undefined ? tri.fare_diff_pct : (Math.round(((triMarketFare - triDgcaRate) / triDgcaRate) * 1000) / 10);
            const triApixVal = tri.apix_index || (ov.apix_kpi ? ov.apix_kpi.current : 103.34);
            const triCpiVal = tri.official_cpi_index || 104.20;
            const triCpiDelta = tri.cpi_tracking_delta !== undefined ? tri.cpi_tracking_delta : (Math.round((triApixVal - triCpiVal) * 100) / 100);

            const elTriMkt = document.getElementById("tri-market-avg");
            if (elTriMkt) elTriMkt.textContent = "₹" + Math.round(triMarketFare).toLocaleString();
            const elTriDgca = document.getElementById("tri-dgca-const");
            if (elTriDgca) elTriDgca.textContent = "₹" + Math.round(triDgcaRate).toLocaleString();
            const elTriDiff = document.getElementById("tri-fare-diff");
            if (elTriDiff) elTriDiff.textContent = (triDiffInr >= 0 ? "+" : "") + "₹" + Math.round(triDiffInr).toLocaleString() + " (" + (triDiffPct >= 0 ? "+" : "") + triDiffPct + "%)";
            const elTriApix = document.getElementById("tri-apix-val");
            if (elTriApix) elTriApix.textContent = Number(triApixVal).toFixed(2);
            const elTriCpi = document.getElementById("tri-cpi-val");
            if (elTriCpi) elTriCpi.textContent = Number(triCpiVal).toFixed(2);
            const elTriDelta = document.getElementById("tri-cpi-delta");
            if (elTriDelta) elTriDelta.textContent = (triCpiDelta >= 0 ? "+" : "") + Number(triCpiDelta).toFixed(2) + " pts";

            const routeTbody = document.getElementById("overview-route-preview-tbody");
            if (routeTbody && ov.heatmap_preview) {
                routeTbody.innerHTML = ov.heatmap_preview.map(r => {
                    const avgFare = r.current_fare || r.average_fare_inr || 5500;
                    const dod = r.dod_pct !== undefined ? r.dod_pct : (r.dod_change_pct || 0);
                    const wow = r.wow_pct !== undefined ? r.wow_pct : (r.wow_change_pct || 0);
                    return `
                    <tr class="hover:bg-slate-50 cursor-pointer" onclick="selectAndGoRoute('${r.sector}')">
                        <td class="py-1.5 font-bold text-blue-900">${r.sector}</td>
                        <td class="py-1.5 text-slate-900">₹${Math.round(avgFare).toLocaleString()}</td>
                        <td class="py-1.5 ${dod >= 0 ? "text-rose-600" : "text-emerald-600"}">${dod >= 0 ? "+" : ""}${dod}%</td>
                        <td class="py-1.5 ${wow >= 0 ? "text-rose-600" : "text-emerald-600"}">${wow >= 0 ? "+" : ""}${wow}%</td>
                    </tr>`;
                }).join("");
            }

            const airlineTbody = document.getElementById("overview-airline-preview-tbody");
            if (airlineTbody && ov.airline_preview) {
                airlineTbody.innerHTML = ov.airline_preview.map(a => {
                    const avgFare = a.average_fare_inr || 5500;
                    const routesCount = a.routes_count || a.routes_operated || 14;
                    const cType = a.carrier_type || a.type || 'LCC';
                    return `
                    <tr class="hover:bg-slate-50 cursor-pointer" onclick="switchTab('tab-airlines')">
                        <td class="py-1.5 font-bold text-slate-900 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full" style="background-color: ${a.color}"></span>
                            <span>${a.airline_name}</span>
                        </td>
                        <td class="py-1.5 font-mono text-slate-800">₹${Math.round(avgFare).toLocaleString()}</td>
                        <td class="py-1.5 font-mono text-slate-500">${routesCount}</td>

        function updateOverviewApixChart() {
            const chart = window.__CHARTS__["overview-apix"];
            if (!chart) return;
            const chartData = window.__INITIAL_CHARTS__ || {};
            const trend = chartData.trend || {};
            const isPsd = overviewWeighting === 'psd';

            const rawLabels = trend.labels || [];
            const rawLasp = isPsd 
                ? (trend.laspeyres_psd || [])
                : (trend.laspeyres_uniform || []);
            const rawJev = isPsd
                ? (trend.jevons_psd || [])
                : (trend.jevons_uniform || []);
            const rawMvg = trend.moving_avg || [];
            const rawCpi = trend.cpi || [];

            let sliceCount = rawLabels.length;
            if (overviewRange === '7D') sliceCount = 7;
            else if (overviewRange === '30D') sliceCount = 30;
            else if (overviewRange === '90D') sliceCount = 90;

            const start = Math.max(0, rawLabels.length - sliceCount);
            const labels = rawLabels.slice(start);
            const lasp = rawLasp.slice(start);
            const jev = rawJev.slice(start);
            const mvg = rawMvg.slice(start);
            const cpi = rawCpi.slice(start);

            const datasets = [
                {
                    label: isPsd ? "Laspeyres APIx (PSD Traffic Weighted)" : "Laspeyres APIx (Uniform Weighted)",
                    data: lasp,
                    borderColor: "#1e40af",
                    backgroundColor: "rgba(30, 64, 175, 0.08)",
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 2,
                    pointHoverRadius: 5
                },
                {
                    label: isPsd ? "Geometric Jevons APIx (PSD Weighted)" : "Geometric Jevons APIx (Uniform Weighted)",
                    data: jev,
                    borderColor: "#0891b2",
                    borderDash: [4, 4],
                    borderWidth: 2,
                    fill: false,
                    tension: 0.3,
                    pointRadius: 2,
                    pointHoverRadius: 5
                }
            ];

            if (overviewFrequency === 'weekly' && mvg.length > 0) {
                datasets.push({
                    label: "7D Rolling Moving Average",
                    data: mvg,
                    borderColor: "#9333ea",
                    borderDash: [2, 2],
                    borderWidth: 2,
                    fill: false,
                    tension: 0.4,
                    pointRadius: 1,
                    pointHoverRadius: 4
                });
            }

            if (overviewShowCpi && cpi.length > 0) {
                datasets.push({
                    label: "Official MoSPI CPI (Airfare Benchmark)",
                    data: cpi,
                    borderColor: "#d97706",
                    backgroundColor: "transparent",
                    borderWidth: 2.5,
                    stepped: true,
                    pointRadius: 2,
                    pointHoverRadius: 5
                });
            }

            chart.data.labels = labels;
            chart.data.datasets = datasets;
            chart.update('active');
        }

        function updateOverviewFareChart() {
            const chartData = window.__INITIAL_CHARTS__ || {};
            const trend = chartData.trend || {};
            const dates = trend.labels || [];
            let fares = trend.average_fares || (trend.datasets || []).find(d => d.label && d.label.includes("Average Fare"))?.data || [];

            if (!fares || fares.length === 0) {
                const lasp = trend.laspeyres_psd || trend.laspeyres_uniform || [];
                fares = lasp.map(v => Math.round(5519.42 * (v / 100.0)));
            }

            let sliceCount = 30;
            if (overviewRange === '7D') sliceCount = 7;
            else if (overviewRange === '30D') sliceCount = 30;
            else if (overviewRange === '90D') sliceCount = 90;
            else if (overviewRange === 'ALL') sliceCount = dates.length;

            const start = Math.max(0, dates.length - sliceCount);
            const sliceDates = dates.slice(start);
            const sliceFares = fares.slice(start);

            // Update badge and stat labels
            const badge = document.getElementById("overview-fare-series-badge");
            if (badge) badge.textContent = (overviewRange === 'ALL' ? 'All-Time' : overviewRange) + ' Series';

            const lbl1 = document.getElementById("overview-fare-range-label");
            const lbl2 = document.getElementById("overview-fare-range-label-2");
            if (lbl1) lbl1.textContent = overviewRange;
            if (lbl2) lbl2.textContent = overviewRange;

            if (sliceFares.length > 0) {
                const low = Math.min(...sliceFares);
                const high = Math.max(...sliceFares);
                const spread = high - low;

                const lowEl = document.getElementById("overview-fare-low");
                const highEl = document.getElementById("overview-fare-high");
                const spreadEl = document.getElementById("overview-fare-spread");

                if (lowEl) lowEl.textContent = "₹" + Math.round(low).toLocaleString();
                if (highEl) highEl.textContent = "₹" + Math.round(high).toLocaleString();
                if (spreadEl) spreadEl.textContent = "₹" + Math.round(spread).toLocaleString();

            const ctx2 = document.getElementById("overview-fare-chart");

            if (window.__CHARTS__["overview-fare"]) {
                const chart = window.__CHARTS__["overview-fare"];
                chart.data.labels = sliceDates;
                chart.data.datasets[0].data = sliceFares;

        // 6. Render Routes
        function renderRoutes(routesData) {
            if (!routesData) return;

            const selector = document.getElementById("route-tab-selector");
            if (selector && routesData.routes_list) {
                selector.innerHTML = routesData.routes_list.map(r => `
                    <option value="${r}">${r}</option>
                `).join("");
                selector.value = activeRouteCode;
            }

            if (routesData.rankings) {
                const r = routesData.rankings;
                renderRankingList("ranking-cheapest", r.cheapest, "emerald");
                renderRankingList("ranking-expensive", r.most_expensive, "rose");
                renderRankingList("ranking-increase", r.highest_increase, "rose");
                renderRankingList("ranking-decrease", r.highest_decrease, "emerald");
            }

            // Populate Route Pricing vs Constant DGCA Benchmark Rate (₹5,450.00) Table
            const dgcaRouteTbody = document.getElementById("route-dgca-table-tbody");
            const routeTableItems = routesData.heatmap_table || [];
            if (dgcaRouteTbody && routeTableItems.length) {
                dgcaRouteTbody.innerHTML = routeTableItems.map(r => {
                    const avgFare = r.current_fare || r.average_fare_inr || 5500;
                    const dgcaConst = 5450.0;
                    const diffInr = Math.round(avgFare - dgcaConst);
                    const diffPct = (Math.round(((avgFare - dgcaConst) / dgcaConst) * 1000) / 10);
                    const isBelow = diffInr <= 0;
                    const isBand = Math.abs(diffPct) <= 10.0;
                    const origCity = r.origin_city || r.origin;
                    const destCity = r.destination_city || r.dest_city || r.destination;
                    const dist = r.distance_km || 1148;
                    const badgeClass = isBand
                        ? 'bg-blue-100 text-blue-800 border border-blue-300'
                        : (isBelow ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300');
                    const badgeLabel = isBand
                        ? 'Balanced (±10% Band)'
                        : (isBelow ? 'Budget Corridor (' + diffPct + '%)' : 'Peak Surge Corridor (+' + diffPct + '%)');

                    return `
                    <tr class="hover:bg-slate-50 cursor-pointer">
                        <td class="py-2.5 px-3 font-bold text-blue-900">${r.sector}</td>
                        <td class="py-2.5 px-3 font-sans text-slate-800 font-medium">${origCity} → ${destCity}</td>
                        <td class="py-2.5 px-3 font-mono text-slate-500">${dist} km</td>
                        <td class="py-2.5 px-3 font-bold text-slate-900">₹${Math.round(avgFare).toLocaleString()}</td>
                        <td class="py-2.5 px-3 text-slate-600">₹${Math.round(dgcaConst).toLocaleString()}</td>
                        <td class="py-2.5 px-3 font-bold ${isBelow ? 'text-emerald-600' : 'text-rose-600'}">${diffInr >= 0 ? '+' : ''}₹${Math.round(diffInr).toLocaleString()}</td>
                        <td class="py-2.5 px-3 font-bold ${isBelow ? 'text-emerald-600' : 'text-rose-600'}">${diffPct >= 0 ? '+' : ''}${diffPct}%</td>
                        <td class="py-2.5 px-3 font-sans">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${badgeClass}">
                                ${badgeLabel}
                            </span>
                        </td>
                        <td class="py-2.5 px-3 text-center font-sans">
                            <button onclick="selectAndGoRoute('${r.sector}')" class="px-2.5 py-1 rounded bg-blue-50 text-blue-700 hover:bg-blue-600 hover:text-white font-bold text-[11px] transition cursor-pointer">
                                Inspect
                            </button>
                        </td>
                    </tr>`;
                }).join("");
            }

            renderSingleRouteData(activeRouteCode);
        }

        function renderRankingList(elemId, items, color) {
            const container = document.getElementById(elemId);
            if (!container || !items) return;
            container.innerHTML = items.map((item, idx) => {
                const fare = item.average_fare_inr || item.current_fare;
                const change = item.wow_change_pct !== undefined ? item.wow_change_pct : (item.wow_pct !== undefined ? item.wow_pct : (item.mom_pct || 0));
                return `
                <div class="flex items-center justify-between py-1 border-b border-slate-100 cursor-pointer hover:bg-slate-50" onclick="selectAndGoRoute('${item.sector}')">
                    <span class="font-bold text-slate-800">${idx + 1}. ${item.sector}</span>
                    <span class="font-mono text-${color}-600 font-semibold">
                        ${fare ? "₹" + Math.round(fare).toLocaleString() : (change >= 0 ? "+" : "") + change + "%"}
                    </span>
                </div>`;
            }).join("");
        }

        function onRouteTabSelect(routeCode) {
            activeRouteCode = routeCode;
            const gf = document.getElementById("gf-route");
            if (gf) gf.value = routeCode;
            renderSingleRouteData(routeCode);
        }

        function renderSingleRouteData(routeCode) {
            const bp = window.__BLUEPRINT_DATA__;
            if (!bp || !bp.routes || !bp.routes.routes_catalog) return;
            const details = bp.routes.routes_catalog[routeCode];
            if (!details) return;

            const k = details.kpis || {};
            const avgFare = details.current_fare || k.current_avg_fare || details.median_fare || 5500;
            const minFare = details.min_fare || k.min_fare || 3000;
            const maxFare = details.max_fare || k.max_fare || 12000;
            const medFare = details.median_fare || k.median_fare || avgFare;
            const stdDev = details.std_dev || k.std_dev || 1500;
            const cvVal = details.volatility_cv || k.volatility_cv || 25.0;
            const dodVal = details.dod_pct !== undefined ? details.dod_pct : (k.dod_change_pct || 0);
            const wowVal = details.wow_pct !== undefined ? details.wow_pct : (k.wow_change_pct || 0);
            const airlinesCount = details.airlines_count || k.airlines_operating || 5;
            const quotesCount = details.quotes_count || k.flight_quotes || 975;
            const dgcaTarget = details.dgca_benchmark_fare || 5450;
            const diffInr = details.diff_vs_dgca_inr !== undefined ? details.diff_vs_dgca_inr : Math.round(avgFare - dgcaTarget);
            const diffPct = details.diff_vs_dgca_pct !== undefined ? details.diff_vs_dgca_pct : (Math.round(((avgFare - dgcaTarget) / dgcaTarget) * 1000) / 10);

            const elIndex = document.getElementById("rkpi-index");
            if (elIndex) elIndex.textContent = (details.apix || k.index || 108.4).toFixed(2);
            const el24h = document.getElementById("rkpi-24h");
            if (el24h) el24h.textContent = (dodVal >= 0 ? "+" : "") + dodVal + "%";
            const el7d = document.getElementById("rkpi-7d");
            if (el7d) el7d.textContent = (wowVal >= 0 ? "+" : "") + wowVal + "%";
            const elAvg = document.getElementById("rkpi-avg");
            if (elAvg) elAvg.textContent = "₹" + Math.round(avgFare).toLocaleString();
            const elMin = document.getElementById("rkpi-min");
            if (elMin) elMin.textContent = "₹" + Math.round(minFare).toLocaleString();
            const elMax = document.getElementById("rkpi-max");
            if (elMax) elMax.textContent = "₹" + Math.round(maxFare).toLocaleString();
            const elMed = document.getElementById("rkpi-median");
            if (elMed) elMed.textContent = "₹" + Math.round(medFare).toLocaleString();
            const elStd = document.getElementById("rkpi-std");
            if (elStd) elStd.textContent = "₹" + Math.round(stdDev).toLocaleString();
            const elCv = document.getElementById("rkpi-cv");
            if (elCv) elCv.textContent = cvVal + "%";
            const elCarriers = document.getElementById("rkpi-carriers");
            if (elCarriers) elCarriers.textContent = airlinesCount + " Airlines";
            const elFlights = document.getElementById("rkpi-flights");
            if (elFlights) elFlights.textContent = quotesCount + " quotes";
            const elCheapAir = document.getElementById("rkpi-cheapest-carrier");
            if (elCheapAir) elCheapAir.textContent = k.cheapest_airline || "IndiGo";
            const elCheapFare = document.getElementById("rkpi-cheapest-carrier-fare");
            if (elCheapFare) elCheapFare.textContent = "avg ₹" + Math.round(k.cheapest_fare || minFare).toLocaleString();

            const elDgcaWeight = document.getElementById("route-dgca-weight");
            if (elDgcaWeight) elDgcaWeight.textContent = (details.dgca_weight_pct || details.route_weight_pct || 14.2) + "%";
            const elDist = document.getElementById("route-distance");
            if (elDist) elDist.textContent = (details.distance_km || 1148) + " km";

            // DGCA Route benchmark display
            const elRouteDgca = document.getElementById("route-dgca-benchmark");
            if (elRouteDgca) elRouteDgca.textContent = "₹" + Math.round(dgcaTarget).toLocaleString();
            const elRouteDiff = document.getElementById("route-dgca-diff");
            if (elRouteDiff) elRouteDiff.textContent = (diffInr >= 0 ? "+" : "") + "₹" + Math.round(diffInr).toLocaleString() + " (" + (diffPct >= 0 ? "+" : "") + diffPct + "%)";

            const d = details.distribution || {};
            const elP25 = document.getElementById("r-dist-p25");
            if (elP25) elP25.textContent = "₹" + Math.round(d.p25 || details.p25 || avgFare * 0.82).toLocaleString();
            const elDistMed = document.getElementById("r-dist-median");
            if (elDistMed) elDistMed.textContent = "₹" + Math.round(d.median || medFare).toLocaleString();
            const elP75 = document.getElementById("r-dist-p75");
            if (elP75) elP75.textContent = "₹" + Math.round(d.p75 || details.p75 || avgFare * 1.18).toLocaleString();
            const elIqr = document.getElementById("r-dist-iqr");
            if (elIqr) elIqr.textContent = "₹" + Math.round(d.iqr || details.iqr || stdDev * 1.35).toLocaleString();
            const elDistStd = document.getElementById("r-dist-std");
            if (elDistStd) elDistStd.textContent = "₹" + Math.round(d.std_dev || stdDev).toLocaleString();

            const carrierTbody = document.getElementById("route-carrier-tbody");
            const carriersList = details.carriers || details.carrier_comparison || [];
            if (carrierTbody && carriersList.length) {
                carrierTbody.innerHTML = carriersList.map(c => {
                    const cAvg = c.avg_fare || c.average_fare_inr || 5000;
                    const cMin = c.min_fare || c.min_fare_inr || 3000;
                    const cMax = c.max_fare || c.max_fare_inr || 10000;
                    const cType = c.carrier_type || 'LCC';
                    const cColor = c.color || '#2563eb';
                    const cName = c.airline_name || c.airline_code || 'Carrier';
                    const isBelow = cAvg <= avgFare;
                    return `
                    <tr class="hover:bg-slate-50">
                        <td class="py-2 px-3 font-bold text-slate-800 flex items-center gap-1.5">
                            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${cColor}"></span>

        // 15. Fare Explorer Logic
        function initExplorer() {
            const initialFlights = window.__INITIAL_FLIGHTS__ || {};
            const quotes = initialFlights.flights || [];
            explorerQuotes = quotes;
            applyExplorerFilters();
        }

        let activeInteractiveSearchId = null;

        async function submitInteractiveSearch(event) {
            event.preventDefault();
            const requestId = Symbol("interactive-search");
            window.__ACTIVE_INTERACTIVE_SEARCH__ = requestId;
            const status = document.getElementById("interactive-search-status");
            const button = document.getElementById("interactive-search-submit");
            const payload = {
                origin: document.getElementById("search-origin").value,
                destination: document.getElementById("search-destination").value,
                departure_date: document.getElementById("search-departure-date").value,
                adults: Number(document.getElementById("search-adults").value),
                children: Number(document.getElementById("search-children").value),
                infants: Number(document.getElementById("search-infants").value),
                cabin: document.getElementById("search-cabin").value,
                trip_type: "ONE_WAY"
            };
            button.disabled = true;
            status.textContent = `Searching ${payload.origin} → ${payload.destination} for ${payload.departure_date}...`;
            explorerQuotes = [];
            applyExplorerFilters();
            try {
                const created = await fetch("/search/jobs", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
                if (!created.ok) throw new Error((await created.json()).detail || "Search request failed");
                const job = await created.json();
                activeInteractiveSearchId = job.job_id;
                while (window.__ACTIVE_INTERACTIVE_SEARCH__ === requestId) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    const response = await fetch(`/search/jobs/${job.job_id}`);
                    const current = await response.json();
                    if (window.__ACTIVE_INTERACTIVE_SEARCH__ !== requestId) return;
                    if (current.status === "failed") throw new Error(current.error || "Cleartrip search failed");
                    if (current.status === "completed") {
                        explorerQuotes = (current.results || []).map(f => ({
                            offer_id: f.source?.raw_offer_id,
                            flight_number: f.airline_code,
                            airline_code: f.airline_code,
                            airline_name: f.airline_code,
                            origin: f.route.origin,
                            destination: f.route.destination,
                            route: `${f.route.origin}-${f.route.destination}`,
                            departure_datetime: f.departure_at,
                            departure_time: new Date(f.departure_at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}),
                            price_inr: f.price_inr,
                            total_price_inr: f.price_inr,
                            base_fare_inr: f.price_inr,
                            tax_inr: 0,
                            source: f.source.source_name,
                            source_name: f.source.source_name,
                            source_type: f.source.source_type
                        }));
                        applyExplorerFilters();
                        status.textContent = `Search complete: ${current.result_count} matching fares.`;
                        break;
                    }
                    status.textContent = `Searching ${payload.origin} → ${payload.destination} for ${payload.departure_date} (${current.status})...`;
                }
            } catch (error) {
                if (window.__ACTIVE_INTERACTIVE_SEARCH__ === requestId) status.textContent = `Search failed: ${error.message}`;
            } finally {
                if (window.__ACTIVE_INTERACTIVE_SEARCH__ === requestId) button.disabled = false;
            }
        }

        async function onExplorerRouteChange() {
            const routeFilterEl = document.getElementById("route-select") || document.getElementById("explorer-route-filter");
            const routeVal = routeFilterEl ? routeFilterEl.value : "ALL";
            if (routeVal !== "ALL" && routeVal.includes("-")) {
                const [orig, dest] = routeVal.split("-");
                try {
                    const res = await fetch(`/dashboard/api/route-flights?origin=${orig}&destination=${dest}&limit=100`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.flights && data.flights.length) {
                            const existingIds = new Set(explorerQuotes.map(q => q.offer_id));
                            data.flights.forEach(f => {
                                if (!existingIds.has(f.offer_id)) {
                                    explorerQuotes.push(f);
                                    existingIds.add(f.offer_id);
                                }
                            });
                        }
                    }
                } catch (e) {
                    console.warn("Could not fetch route flights:", e);
                }
            }
            applyExplorerFilters();
        }

        function applyExplorerFilters() {
            const search = (document.getElementById("explorer-search") ? document.getElementById("explorer-search").value : "").toLowerCase().trim();
            const routeFilterEl = document.getElementById("route-select") || document.getElementById("explorer-route-filter");
            const route = routeFilterEl ? routeFilterEl.value : "ALL";
            const airline = document.getElementById("explorer-airline-filter") ? document.getElementById("explorer-airline-filter").value : "ALL";
            const lead = document.getElementById("explorer-lead-filter") ? document.getElementById("explorer-lead-filter").value : "ALL";
            const source = document.getElementById("gf-source") ? document.getElementById("gf-source").value : "ALL";
            const sort = document.getElementById("explorer-sort-by") ? document.getElementById("explorer-sort-by").value : "price_asc";

            filteredQuotes = explorerQuotes.filter(f => {
                const orig = (f.origin || "").toLowerCase();
                const dest = (f.destination || "").toLowerCase();
                const fltNum = (f.flight_number || "").toLowerCase();
                const airCode = (f.airline_code || "").toLowerCase();
                const airName = (f.airline_name || "").toLowerCase();
                const src = (f.source_name || f.source || "").toLowerCase();
                const fRoute = f.route || f.sector || `${f.origin}-${f.destination}`;

                if (search) {
                    const matchText = `${fltNum} ${airCode} ${airName} ${orig} ${dest} ${src}`;
                    if (!matchText.includes(search)) return false;
                }
                if (route !== "ALL" && fRoute !== route) return false;
                if (airline !== "ALL" && f.airline_code !== airline) return false;
                if (lead !== "ALL" && !(f.lead_window || "").startsWith(lead)) return false;
                if (source !== "ALL" && (f.source_type || "").toUpperCase() !== source) return false;
                return true;
            });

            if (sort === "price_asc") {
                filteredQuotes.sort((a, b) => (a.total_price_inr || a.price_inr || 0) - (b.total_price_inr || b.price_inr || 0));
            } else if (sort === "price_desc") {
                filteredQuotes.sort((a, b) => (b.total_price_inr || b.price_inr || 0) - (a.total_price_inr || a.price_inr || 0));
            } else if (sort === "time_asc") {
                filteredQuotes.sort((a, b) => (a.departure_time || "").localeCompare(b.departure_time || ""));
            }

            explorerPage = 1;
            renderExplorerPage();
        }

        function renderExplorerPage() {
            const tbody = document.getElementById("explorer-tbody");
            if (!tbody) return;

            const total = filteredQuotes.length;
            const countEl = document.getElementById("explorer-count");
            if (countEl) countEl.textContent = total.toLocaleString();

            const totalPages = Math.max(1, Math.ceil(total / explorerPageSize));
            const totalPagesEl = document.getElementById("explorer-total-pages");
            if (totalPagesEl) totalPagesEl.textContent = totalPages;
            const curPageEl = document.getElementById("explorer-current-page");
            if (curPageEl) curPageEl.textContent = explorerPage;
            const pagInfoEl = document.getElementById("explorer-pagination-info");
            if (pagInfoEl) pagInfoEl.textContent = "Page " + explorerPage + " of " + totalPages;

            const prevBtn = document.getElementById("explorer-prev-btn");
            if (prevBtn) prevBtn.disabled = (explorerPage <= 1);
            const nextBtn = document.getElementById("explorer-next-btn");
            if (nextBtn) nextBtn.disabled = (explorerPage >= totalPages);

            const startIdx = (explorerPage - 1) * explorerPageSize;
            const pageItems = filteredQuotes.slice(startIdx, startIdx + explorerPageSize);

            if (pageItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="py-8 text-center text-slate-400 font-sans">No matching flight quotes found. Clear filters to see all fares.</td></tr>`;
                return;
            }

            tbody.innerHTML = pageItems.map(f => {
                const totPrice = f.total_price_inr || f.price_inr || 5000;
                const baseFare = f.base_fare_inr || Math.round(totPrice * 0.65);
                const taxFare = f.tax_inr || Math.round(totPrice - baseFare);
                const orig = f.origin || 'DEL';
                const dest = f.destination || 'BOM';
                const airName = f.airline_name || f.airline_code || 'Airline';
                const fltNum = f.flight_number || (f.airline_code + '-101');
                const depTime = f.departure_time || '08:30';
                const leadWin = f.lead_window || 'T+7';
                const srcName = f.source_name || f.source || 'Scraper';

                return `
                <tr class="hover:bg-slate-50">
                    <td class="py-2 px-3 font-bold text-slate-900">${fltNum}</td>
                    <td class="py-2 px-3 font-sans font-medium text-slate-800">${airName}</td>
                    <td class="py-2 px-3 font-bold text-blue-900">${orig} → ${dest}</td>
                    <td class="py-2 px-3 text-slate-600">${depTime}</td>
                    <td class="py-2 px-3"><span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-purple-50 text-purple-700 border border-purple-200">${leadWin}</span></td>
                    <td class="py-2 px-3 text-slate-700">₹${Math.round(baseFare).toLocaleString()}</td>
                    <td class="py-2 px-3 text-slate-500">₹${Math.round(taxFare).toLocaleString()}</td>
                    <td class="py-2 px-3 font-bold text-slate-900">₹${Math.round(totPrice).toLocaleString()}</td>
                    <td class="py-2 px-3 font-sans text-slate-500">${srcName}</td>
                    <td class="py-2 px-3 font-sans"><i class="fa-solid fa-circle-check text-emerald-500"></i></td>
                </tr>`;
            }).join("");
        }

        function prevExplorerPage() {
            if (explorerPage > 1) {
                explorerPage--;
                renderExplorerPage();
            }
        }

        function nextExplorerPage() {
            const totalPages = Math.ceil(filteredQuotes.length / explorerPageSize);
            if (explorerPage < totalPages) {
                explorerPage++;
                renderExplorerPage();
            }
        }

        function exportExplorerCSV() {
            if (!filteredQuotes || filteredQuotes.length === 0) {
                alert("No quotes available to export.");
                return;
            }
            const headers = ["flight_number", "airline", "origin", "destination", "route", "departure_time", "lead_window", "base_fare_inr", "tax_inr", "total_price_inr", "source"];
            const rows = filteredQuotes.map(f => {
                const tot = f.total_price_inr || f.price_inr || 0;
                const base = f.base_fare_inr || Math.round(tot * 0.65);
                const tax = f.tax_inr || (tot - base);
                return [
                    f.flight_number || "",
                    f.airline_name || f.airline_code || "",
                    f.origin || "",
                    f.destination || "",
                    f.route || f.sector || "",
                    f.departure_time || "08:30",
                    f.lead_window || "T+7",
                    base,
                    tax,
                    tot,
                    f.source_name || f.source || "Scraper"
                ];
            });
            let csvContent = headers.join(",") + "\n";
            rows.forEach(r => {
                csvContent += r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(",") + "\n";
            });
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "APIx_Flight_Fares_Export_" + new Date().toISOString().slice(0, 10) + ".csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function exportExplorerJSON() {
            if (!filteredQuotes || filteredQuotes.length === 0) {
                alert("No quotes available to export.");
                return;
            }
            const jsonString = JSON.stringify(filteredQuotes, null, 2);
            const blob = new Blob([jsonString], { type: "application/json;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "APIx_Flight_Fares_Export_" + new Date().toISOString().slice(0, 10) + ".json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 16. MoSPI CPI Explorer Live Fetch & Render
        function renderCpiExplorer() {
            const cpiData = window.__INITIAL_CPI__ || {};
            renderCpiTableAndChart(cpiData);
        }

        function fetchAndUpdateCpi(force) {
            const yearEl = document.getElementById("cpi-year-select") || document.getElementById("cpi-sel-year");
            const year = yearEl ? yearEl.value : 2026;
            const baseEl = document.getElementById("cpi-sel-base");
            const base = baseEl ? baseEl.value : 2024;
            const itemEl = document.getElementById("cpi-item-select") || document.getElementById("cpi-sel-item");
            const item = itemEl ? itemEl.value : "07.3.3";

            const url = `/dashboard/api/cpi?year=${year}&item_code=${item}&base_year=${base}&refresh=${force ? 'true' : 'false'}`;
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    renderCpiTableAndChart(data);
                })
                .catch(err => console.error("Failed to load CPI data:", err));
        }

        function renderCpiTableAndChart(data) {
            const records = (data && (data.records || data.data)) || [];
            const summary = (data && data.summary) || {};

            const elLatest = document.getElementById("cpi-card-latest-index");
            if (elLatest && summary.latest_index) {
                elLatest.textContent = Number(summary.latest_index).toFixed(2);
            }
            const elInf = document.getElementById("cpi-card-avg-inflation");
            if (elInf && summary.average_inflation_pct) {
                elInf.textContent = (summary.average_inflation_pct >= 0 ? "+" : "") + Number(summary.average_inflation_pct).toFixed(2) + "%";
            }

            const tbody = document.getElementById("cpi-table-tbody");
            if (tbody) {
                if (records.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400 font-sans">No CPI records found for this criteria.</td></tr>`;
                } else {
                    tbody.innerHTML = records.map(r => {
                        const month = r.month || r.month_name || "July";
                        const yr = r.year || 2026;
                        const itemDesc = r.item || r.class || r.item_name || "Passenger transport by air";
                        const sec = r.sector || "Combined";
                        const idxNum = parseFloat(r.index || r.index_value || 110.79);
                        const infNum = parseFloat(r.inflation || r.inflation_rate || 16.28);
                        const isPos = infNum >= 0;

                        return `
                        <tr class="hover:bg-slate-50">
                            <td class="py-2 px-3 font-bold text-slate-800">${month}</td>
                            <td class="py-2 px-3 text-slate-600">${yr}</td>
                            <td class="py-2 px-3 font-sans text-slate-700 font-medium">${itemDesc}</td>
                            <td class="py-2 px-3 font-sans text-slate-500">${sec}</td>
                            <td class="py-2 px-3 font-bold text-orange-700 font-mono">${idxNum.toFixed(2)}</td>
                            <td class="py-2 px-3 font-bold font-mono ${isPos ? 'text-rose-600' : 'text-emerald-600'}">${isPos ? '+' : ''}${infNum.toFixed(2)}%</td>
                            <td class="py-2 px-3 font-sans text-emerald-700 font-semibold">Official MoSPI</td>
                        </tr>`;
                    }).join("");
                }
            }

            const ctx = document.getElementById("cpi-comparison-chart");
            if (ctx) {
                if (window.__CHARTS__["cpi-comparison"]) window.__CHARTS__["cpi-comparison"].destroy();
                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep"];
                const cpiSeries = [104.2, 105.1, 106.8, 107.5, 108.9, 109.8, 110.79, 111.4, 112.1];
                const apixNormalized = [103.8, 104.5, 106.2, 107.9, 109.4, 110.1, 110.85, 111.9, 112.6];

                window.__CHARTS__["cpi-comparison"] = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: months,
                        datasets: [
                            {
                                label: "Official Transport CPI (07.3.3 Airfare)",
                                data: cpiSeries,
                                borderColor: "#dd6b20",
                                backgroundColor: "rgba(221, 107, 32, 0.08)",
                                borderWidth: 2.5,
                                fill: true,
                                tension: 0.3,
                                pointRadius: 3
                            },
                            {
                                label: "Real-Time Airfare Price Index (APIx Rescaled)",
                                data: apixNormalized,
                                borderColor: "#205493",
                                borderWidth: 2.5,
                                borderDash: [4, 4],
                                fill: false,
                                tension: 0.3,
                                pointRadius: 3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { intersect: false, mode: "index" },
                        plugins: {
                            legend: { position: "top", labels: { boxWidth: 12, font: { size: 11, family: "Inter" } } },
                            tooltip: {
                                callbacks: {
                                    label: function(c) {
                                        return c.dataset.label + ": " + Number(c.parsed.y).toFixed(2);
                                    }
                                }
                            }
                        },
                        scales: {
                            y: { ticks: { font: { size: 10, family: "JetBrains Mono" } }, grid: { color: "#f1f5f9" } },
                            x: { ticks: { font: { size: 10, family: "JetBrains Mono" } }, grid: { display: false } }
                        }
                    }
                });
            }
        }

        // 17. Pipeline Scraper Ingestion Trigger
        function triggerPipelineIngest() {
            const btn = document.getElementById("btn-ingest-text");
            if (btn) btn.innerText = "Ingesting Scraped Data...";
            fetch("/dashboard/api/pipeline/ingest", { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    if (data.status === "success") {
                        if (btn) btn.innerText = "Ingested " + (data.total_inserted || 0) + " New Fares!";
                        setTimeout(() => {
                            if (btn) btn.innerText = "Ingest Scraped JSON Files";
                            refreshBlueprintData();
                        }, 2000);
                    } else {
                        if (btn) btn.innerText = "Ingestion Complete (0 New)";
                        setTimeout(() => {
                            if (btn) btn.innerText = "Ingest Scraped JSON Files";
                        }, 2000);
                    }
                })
                .catch(err => {
                    console.error("Ingestion failed:", err);
                    if (btn) btn.innerText = "Ingest Error";
                    setTimeout(() => {
                        if (btn) btn.innerText = "Ingest Scraped JSON Files";
                    }, 2500);
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            initApp();
        });
    </script>
