[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airfare-index-india"
version = "0.1.0"
description = "Real-time Airfare Price Index for India (SIH 2026 - SIH26056)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "patchright==1.62.3",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = [".", ".."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/loader.py" = ["E402"]
"dashboard/app.py" = ["E402"]
"database/seed_data.py" = ["E402"]

[tool.setuptools.packages.find]
include = ["api*", "config*", "dashboard*", "database*", "index_engine*", "models*", "pipeline*", "scheduler*", "scraper*"]
exclude = ["data*", "doc*", "docs*", "tests*"]
